id = "herdr-workspaces-manager"
name = "Workspaces manager"
version = "0.2.0"
min_herdr_version = "0.9.3"
description = "Discover projects and open them in Herdr workspaces or panes"
platforms = ["macos", "linux"]

[[build]]
command = ["bash", "herdr/install.sh"]

[[actions]]
id = "open"
title = "Open workspaces manager"
contexts = ["workspace"]
command = ["sh", "launch.sh"]

[[panes]]
id = "picker"
title = "Workspaces"
placement = "popup"
width = "85%"
height = "85%"
command = ["sh", "herdr/run.sh"]
