[package]
name = "herdr-workspaces-manager"
version = "0.1.1"
edition = "2024"
description = "Discover local projects and create distinct Herdr workspaces"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ignore = "0.4"
globset = "0.4"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
